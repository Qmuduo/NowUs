<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F2EB">
  <title>NowUs · 看见彼此的一天</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%232F6B4F'/%3E%3Cpath d='M18 42V22l28 20V22' stroke='%23FAFCFA' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=review91">
</head>
<body>
  <aside class="review-panel" aria-label="原型评审">
    <a class="review-brand" href="../README.md">NowUs<span class="brand-dot"></span></a>
    <p class="review-caption">产品原型 · 首次使用与配对</p>
    <h1>看见彼此，<br>也看见彼此的一天。</h1>
    <p class="review-intro">我的夜晚，你的早晨。<br>在不同的生活节奏里，找到我们的时间。</p>
    <div class="review-divider"></div>
    <p class="review-label">试试不同的一天</p>
    <div id="desktop-scenarios" class="scenario-list"></div>
    <button type="button" class="primary-button review-setup" data-action="start-setup">体验首次使用与配对</button>
    <p class="review-disclaimer">演示人物与固定时间。留言和提醒仅用于本地体验，不会发送给任何人。</p>
    <a class="review-doc" href="../docs/superpowers/specs/2026-09-29-nowus-product-design.md">查看产品设计文档 <span aria-hidden="true">↗</span></a>
  </aside>

  <div class="phone" aria-label="NowUs 手机原型">
    <div class="statusbar" aria-hidden="true"><span id="device-clock"></span><span class="device-signals"><span class="signal-bars"><i></i><i></i><i></i></span><svg viewBox="0 0 20 16"><path d="M2 5.5a12 12 0 0 1 16 0M5 8.5a7.5 7.5 0 0 1 10 0M8.2 11.5a3 3 0 0 1 3.6 0M10 14h.01" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="battery"></span></span></div>
    <header class="app-header" id="app-header">
      <div class="wordmark">NowUs<span class="brand-dot"></span></div>
      <button type="button" class="demo-switch icon-button" id="mobile-demo" aria-label="切换演示场景"><span>演示</span><span aria-hidden="true">⌄</span></button>
      <button type="button" class="text-button" id="exit-setup" hidden>返回首页</button>
    </header>
    <main id="app" tabindex="-1">
      <section class="view active" id="home-view" aria-label="此刻"></section>
      <section class="view" id="day-view" aria-label="我们的一天" hidden></section>
      <section class="view" id="rhythm-view" aria-label="我的节奏" hidden></section>
      <section class="view" id="setup-view" aria-label="首次使用与配对" hidden></section>
      <noscript><p class="noscript">请启用 JavaScript 查看可交互原型。</p></noscript>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button type="button" data-tab="home" aria-current="page"><span class="tab-icon" id="home-tab-icon"></span><span>此刻</span></button>
      <button type="button" data-tab="day"><span class="tab-icon" id="day-tab-icon"></span><span>我们的一天</span></button>
      <button type="button" data-tab="rhythm"><span class="tab-icon" id="rhythm-tab-icon"></span><span>我的节奏</span></button>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <button type="button" class="scrim" id="scrim" aria-label="关闭弹窗" tabindex="-1" hidden></button>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-header"><h2 id="sheet-title"></h2><button type="button" class="icon-button" id="close-sheet" aria-label="关闭弹窗">×</button></div>
      <div id="sheet-content"></div>
    </section>
  </div>
  <script type="module" src="./app.mjs?v=review91"></script>
</body>
</html>
